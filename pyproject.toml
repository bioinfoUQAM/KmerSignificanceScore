[build-system]
requires = ["setuptools>=68,<81", "wheel>=0.41,<1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kmer-significance-score"
version = "1.1.0"
description = "KmerSignificance Score (KSS): a discriminative and biologically informed framework for viral k-mer prioritization"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.15"
keywords = ["bioinformatics", "virology", "k-mer", "feature selection", "genomic surveillance"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

# Upper bounds are set at the next major version of each package. They are deliberate: the
# numpy 2.0 transition showed that an unbounded requirement silently turns a reproducible
# analysis into a broken one. Exact versions used to produce the published results are
# recorded in requirements-lock.txt.
dependencies = [
    "biopython>=1.81,<2.0",
    "numpy>=1.24,<3.0",
    "pandas>=2.0,<4.0",
    "pyyaml>=6.0,<7.0",
    "requests>=2.28,<3.0",
]

[project.optional-dependencies]
# Needed to reproduce the benchmarks, the statistical analyses and the figures, but not to
# run the scoring pipeline itself.
analysis = [
    "scipy>=1.10,<2.0",
    "scikit-learn>=1.3,<2.0",
    "matplotlib>=3.7,<4.0",
    "joblib>=1.3,<2.0",
    "statsmodels>=0.14,<1.0",
    "tqdm>=4.65,<5.0",
    "openpyxl>=3.1,<4.0",
]
notebooks = [
    "jupyter>=1.0,<2.0",
    "notebook>=7.0,<8.0",
]

[project.scripts]
kss = "main:main"

[project.urls]
Repository = "https://github.com/bioinfoUQAM/KmerSignificanceScore"

[tool.setuptools]
packages = ["src"]
# main.py sits at the repository root rather than inside the package, so it has to be
# declared separately. Without it the installed `kss` command fails on import.
py-modules = ["main"]
include-package-data = true

[tool.setuptools.package-data]
src = ["substitution_matrices/*.json"]
